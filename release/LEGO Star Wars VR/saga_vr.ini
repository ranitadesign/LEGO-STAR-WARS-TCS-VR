; LEGO Star Wars VR mod by RanitaVR - https://github.com/ranitadesign/LEGO-STAR-WARS-TCS-VR
[vr]
; 1 = render both eyes when an OpenXR headset session is running (F11 toggles in game)
stereo=1
; 1 = synthetic stereo without a headset (for testing; images are not shown anywhere)
simulate=0
; game units per metre of head motion in third person (a minifig is about 0.42 units tall)
world_scale=1.0
; the same in first person (F8); 0.25 makes you roughly minifig sized
fp_world_scale=0.25
; right-hand speed (m/s) that counts as a lightsaber swing (attack); 0 disables
swing_speed=2.5
; seconds before the saber can hurt the same target again (one heart per hit); 0 = every frame it touches
saber_cooldown=0.5
; OpenXR runtime: meta (Quest Link / Air Link), steamvr, or system
runtime=steamvr
; game folder, only needed if it is not found automatically in your Steam libraries
;data_dir=C:\Program Files (x86)\Steam\steamapps\common\Lego Star Wars Saga
; start in first person (F8 toggles)
first_person=1
; right-stick turning speed in degrees per second (try 120); 0 = 30 degree snap turns
smooth_turn=0
; per-eye render size; the headset asks for about 1892x2024. Lower it if the game stutters.
render_width=1600
render_height=1712
; motion lightsaber in first person: the blade follows the right controller (1 on, 0 off)
saber=1
; tilt of the blade relative to the controller, degrees (try 30 or -30 if it feels off)
saber_pitch=0
; size of the hand-held saber (1 = the model's own size)
saber_scale=1.0
; bare-hand orientation fixes in degrees (relative to the controller)
left_hand_yaw=0
left_hand_pitch=0
left_hand_roll=0
right_hand_yaw=0
right_hand_pitch=0
right_hand_roll=0
; 1 = unlock every character, level and extra once play starts (asks to save)
unlock_all=0
